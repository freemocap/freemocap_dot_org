<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="description" content="FreeMoCap usage statistics and growth data - see how our free motion capture software is being used worldwide." />
  <meta name="author" content="The FreeMoCap Project" />
  <title>Data Dashboard | The FreeMoCap Project</title>

  <!-- Open Graph / Social Media -->
  <meta property="og:title" content="Data Dashboard | The FreeMoCap Project" />
  <meta property="og:description" content="See FreeMoCap's global reach - usage statistics, growth trends, and user engagement data." />
  <meta property="og:image" content="./assets/logos/fmc-logo-3-4-22.png" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://freemocap.org/data.html" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="FreeMoCap Data Dashboard" />
  <meta name="twitter:description" content="See FreeMoCap's global reach - usage statistics, growth trends, and user engagement data." />
  <meta name="twitter:image" content="./assets/logos/fmc-logo-3-4-22.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="./assets/favicons/favicon-black.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="./css/main.css">
</head>

<body>
  <!-- Header (loaded by nav.js) -->
  <div id="site-header"></div>

  <!-- Page Hero -->
  <section class="page-hero">
    <video class="page-hero-video" autoplay muted loop playsinline>
      <source src="./assets/video/home-header-short.mp4" type="video/mp4">
    </video>
    <div class="page-hero-overlay"></div>
    <div class="container">
      <h1 class="page-hero-title">🦴 FreeMoCap Data Dashboard</h1>
      <p class="page-hero-subtitle">Explore how FreeMoCap is being used around the world</p>
    </div>
  </section>

  <!-- Quick Stats -->
  <section class="data-stats-section">
    <div class="container">
      <div class="stats-grid">
        <div class="stat-card purple">
          <div id="qs-users" class="stat-value">--</div>
          <div class="stat-label">Users</div>
        </div>
        <div class="stat-card green">
          <div id="qs-pings" class="stat-value">--</div>
          <div class="stat-label">Pings</div>
        </div>
        <div class="stat-card yellow">
          <div id="qs-countries" class="stat-value">--</div>
          <div class="stat-label">Countries</div>
        </div>
      </div>
    </div>
  </section>

  <!-- Tab Navigation - Analytics is first and default -->
  <div class="dashboard-tabs">
    <button class="tab-btn active" data-tab="analytics" onclick="switchTab('analytics')">
      <i class="bi bi-bar-chart"></i>
      <span class="tab-text tab-text-full">FreeMoCap User Analytics</span>
      <span class="tab-text tab-text-short">Users</span>
    </button>
    <button class="tab-btn" data-tab="growth" onclick="switchTab('growth')">
      <i class="bi bi-graph-up"></i>
      <span class="tab-text tab-text-full">FreeMoCap Growth Animation</span>
      <span class="tab-text tab-text-short">Growth</span>
    </button>
<!--      <button class="tab-btn" data-tab="lifespan" onclick="switchTab('lifespan')">-->
<!--        <i class="bi bi-clock"></i>-->
<!--        <span class="tab-text">User Lifespan</span>-->
<!--      </button>-->
  </div>

  <!-- Dashboard Frames -->
  <div class="dashboard-frame-container">
    <div class="frame-loading" id="loading-indicator">
      <div class="spinner"></div>
      <p>Loading dashboard...</p>
    </div>

    <!-- Analytics is first and active by default, lazy loaded -->
    <iframe
      id="frame-analytics"
      class="dashboard-frame active"
      data-src="./data/freemocap_users_dashboard.html"
      onload="frameLoaded('analytics')"
    ></iframe>

    <iframe
      id="frame-growth"
      class="dashboard-frame"
      data-src="./data/freemocap_growth_animation.html"
      onload="frameLoaded('growth')"
    ></iframe>

<!--      <iframe-->
<!--        id="frame-lifespan"-->
<!--        class="dashboard-frame"-->
<!--        data-src="./data/freemocap_lifespan_analysis.html"-->
<!--        onload="frameLoaded('lifespan')"-->
<!--      ></iframe>-->
  </div>

  <!-- Footer (loaded by nav.js) -->
  <div id="site-footer"></div>

  <!-- Shared nav loader -->
  <script src="./js/nav.js"></script>

  <script>

    // Track which frames have been loaded
    const loadedFrames = new Set();
    let currentTab = 'analytics';

    // Load an iframe's content (lazy loading)
    function loadFrame(tabName) {
      const frame = document.getElementById(`frame-${tabName}`);
      if (frame && !frame.src && frame.dataset.src) {
        frame.src = frame.dataset.src;
      }
    }

    function switchTab(tabName) {
      // Update buttons
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tabName);
      });

      // Update frames
      document.querySelectorAll('.dashboard-frame').forEach(frame => {
        frame.classList.remove('active');
      });

      const targetFrame = document.getElementById(`frame-${tabName}`);
      if (targetFrame) {
        targetFrame.classList.add('active');
        loadFrame(tabName);
      }

      // Show loading if not yet loaded
      const loadingIndicator = document.getElementById('loading-indicator');
      if (!loadedFrames.has(tabName)) {
        loadingIndicator.classList.remove('hidden');
      } else {
        loadingIndicator.classList.add('hidden');
      }

      currentTab = tabName;

      // Set height for non-growth frames
      if (tabName !== 'growth') {
        setFrameHeight(tabName);
      }
    }

    function frameLoaded(tabName) {
      loadedFrames.add(tabName);

      if (currentTab === tabName) {
        document.getElementById('loading-indicator').classList.add('hidden');
      }

      // Set height for scrollable frames (not growth)
      if (tabName !== 'growth') {
        setFrameHeight(tabName);
      }

      if (tabName === 'analytics' || tabName === 'growth') {
        loadQuickStats();
      }
    }

    // Set frame height based on content (only for analytics and lifespan)
    function setFrameHeight(tabName) {
      if (tabName === 'growth') return; // Growth has fixed CSS height

      const frame = document.getElementById(`frame-${tabName}`);
      if (frame && frame.contentWindow) {
        try {
          const contentHeight = frame.contentWindow.document.body.scrollHeight;
          if (contentHeight > 100) {
            frame.style.height = contentHeight + 'px';
          }
        } catch (e) {
          frame.style.height = '3000px';
        }
      }
    }

    // Load quick stats from JSON
    async function loadQuickStats() {
      try {
        const response = await fetch('./data/freemocap_dashboard_data.json');
        if (response.ok) {
          const data = await response.json();

          const latest = data.time_series[data.time_series.length - 1];

          document.getElementById('qs-users').textContent =
            latest.cumulative_users >= 1000
              ? (latest.cumulative_users / 1000).toFixed(1) + 'K'
              : latest.cumulative_users.toLocaleString();

          document.getElementById('qs-pings').textContent =
            latest.cumulative_records >= 1000000
              ? (latest.cumulative_records / 1000000).toFixed(1) + 'M'
              : latest.cumulative_records >= 1000
                ? (latest.cumulative_records / 1000).toFixed(0) + 'K'
                : latest.cumulative_records.toLocaleString();

          const countries = new Set(data.map_data.map(m => m.country));
          document.getElementById('qs-countries').textContent = countries.size;
        }
      } catch (e) {
        console.log('Could not load quick stats:', e);
      }
    }

    // Nudge the active iframe's own resize handling (e.g. Plotly charts) to
    // recalculate layout after the outer window resizes. A resize here does
    // not automatically propagate into the iframe's document.
    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        const frame = document.getElementById(`frame-${currentTab}`);
        if (frame && frame.contentWindow) {
          try {
            frame.contentWindow.dispatchEvent(new Event('resize'));
          } catch (e) {
            // Cross-origin or not yet loaded, ignore.
          }
        }
      }, 200);
    });

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      loadFrame('analytics');
      loadQuickStats();
    });
  </script>
</body>
</html>
