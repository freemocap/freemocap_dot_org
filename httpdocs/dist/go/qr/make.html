<!DOCTYPE html>
<!-- QR maker: same style as go/build.mjs (skelly in a white circle, error
     correction H, link printed under the code at the code's exact width).
     Hand-written, not generated. If you change the look in build.mjs,
     change the constants here too. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>if(localStorage.getItem('theme')==='light')document.documentElement.setAttribute('data-theme','light');</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Make a QR Code | The FreeMoCap Project</title>
  <link rel="icon" type="image/x-icon" href="/assets/favicons/favicon-black.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .qm-page { padding: 4rem 0 5rem; }
    .qm-page h1 { margin: 0 0 .75rem; }
    .qm-intro { color: var(--text-secondary); max-width: 46rem; margin: 0 0 2rem; line-height: 1.6; }    .qm-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 360px); gap: 2rem; align-items: start; }
    .qm-form { background: var(--bg-secondary); border: 1px solid var(--card-border); border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; gap: 1.25rem; }
    .qm-field label { display: block; font-weight: 600; margin-bottom: .4rem; color: var(--text-primary); }
    .qm-field input { width: 100%; box-sizing: border-box; padding: .65rem .8rem; border-radius: 8px; border: 1px solid var(--bg-tertiary); background: var(--bg-primary); color: var(--text-primary); font: inherit; }
    .qm-field input:focus { outline: 2px solid var(--accent-teal); outline-offset: 1px; }
    .qm-hint { margin: .4rem 0 0; font-size: .85rem; color: var(--text-muted); line-height: 1.5; }
    .qm-warn { margin: 0; font-size: .9rem; color: var(--accent-highlight); }
    .qm-preview { background: var(--bg-secondary); border: 1px solid var(--card-border); border-radius: 12px; padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; }
    .qm-canvas { background: #fff; border-radius: 8px; padding: .5rem; min-height: 200px; display: flex; align-items: center; justify-content: center; color: #555; font-size: .9rem; text-align: center; }
    .qm-canvas svg { display: block; width: 100%; height: auto; }
    .qm-downloads { display: flex; flex-wrap: wrap; gap: .5rem; }
    .qm-downloads .cta-button { flex: 1 1 auto; display: inline-flex; align-items: center; justify-content: center; gap: .4rem; }
    .qm-downloads .cta-button:disabled { opacity: .5; cursor: not-allowed; }
    @media (max-width: 760px) { .qm-layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main class="qm-page">
    <div class="container">
      <h1>Make a QR code</h1>
      <p class="qm-intro">
        Paste a link to get a FreeMoCap-style QR code.
      </p>

      <div class="qm-layout">
        <form class="qm-form" id="qm-form" autocomplete="off" onsubmit="return false">
          <div class="qm-field">
            <label for="qm-url">Link the code opens</label>
            <input id="qm-url" type="url" placeholder="https://freemocap.org/" spellcheck="false" />
            <p class="qm-hint">Use the full address, starting with https://</p>
          </div>
          <div class="qm-field">
            <label for="qm-label">Text printed under the code</label>
            <input id="qm-label" type="text" spellcheck="false" />
            <p class="qm-hint">Defaults to the link without https://. Clear it to print no text.</p>
          </div>
          <div class="qm-field">
            <label for="qm-name">File name</label>
            <input id="qm-name" type="text" spellcheck="false" />
          </div>
          <p class="qm-warn" id="qm-warn" hidden></p>
        </form>

        <div class="qm-preview">
          <div class="qm-canvas" id="qm-canvas">Your code will show up here.</div>
          <div class="qm-downloads">
            <button class="cta-button" id="qm-svg" type="button" disabled><i class="bi bi-download"></i> SVG (print)</button>
            <button class="cta-button" id="qm-png" type="button" disabled><i class="bi bi-download"></i> PNG</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="/js/nav.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script>
  (function () {
    // Same look as go/build.mjs.
    const MARGIN = 4, CIRCLE = 0.26, LOGO = 0.72, LABEL_GAP = 2, PNG_WIDTH = 1200;
    const FONT = 'Helvetica, Arial, sans-serif';
    qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];

    const $ = id => document.getElementById(id);
    const urlIn = $('qm-url'), labelIn = $('qm-label'), nameIn = $('qm-name');
    let labelEdited = false, nameEdited = false, current = null, logo = null;

    const xml = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const defaultLabel = u => u.replace(/^https?:\/\//i, '').replace(/^([^/]+)\/$/, '$1');
    function defaultName(u) {
      try {
        const p = new URL(u);
        const last = p.pathname.split('/').filter(Boolean).pop() || p.hostname;
        return ('qr-' + last).toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-|-$/g, '');
      } catch (_) { return 'qr-code'; }
    }

    // The logo has to be a data URL so it survives drawing the SVG onto a canvas.
    async function loadLogo() {
      const blob = await (await fetch('logo-bw.png')).blob();
      const href = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
      const img = new Image(); img.src = href; await img.decode();
      logo = { href, w: img.naturalWidth, h: img.naturalHeight };
    }

    // Ink box of the label, so it can be scaled to span exactly the code's width.
    function measure(label) {
      const ctx = document.createElement('canvas').getContext('2d');
      ctx.font = '200px ' + FONT;
      const m = ctx.measureText(label);
      return { left: m.actualBoundingBoxLeft, width: m.actualBoundingBoxLeft + m.actualBoundingBoxRight,
               ascent: m.actualBoundingBoxAscent, height: m.actualBoundingBoxAscent + m.actualBoundingBoxDescent };
    }

    function makeSvg(text, label) {
      const qr = qrcode(0, 'H');
      qr.addData(text);
      qr.make();
      const n = qr.getModuleCount(), total = n + MARGIN * 2, c = total / 2, r = (n * CIRCLE) / 2;
      let path = '';
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
        if (!qr.isDark(y, x)) continue;
        const dx = Math.max(Math.abs(x + MARGIN + 0.5 - c) - 0.5, 0);
        const dy = Math.max(Math.abs(y + MARGIN + 0.5 - c) - 0.5, 0);
        if (Math.hypot(dx, dy) < r) continue;
        path += `M${x + MARGIN} ${y + MARGIN}h1v1h-1z`;
      }
      const lh = r * 2 * LOGO, lw = (lh * logo.w) / logo.h;
      let h = total, text_ = '';
      if (label) {
        const m = measure(label), k = n / m.width, inkTop = n + MARGIN + LABEL_GAP;
        h = inkTop + m.height * k + MARGIN / 2;
        text_ = `<text x="${MARGIN + m.left * k}" y="${inkTop + m.ascent * k}" font-family="${FONT}" font-size="${200 * k}" fill="#000" shape-rendering="auto">${xml(label)}</text>`;
      }
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${total} ${h}" shape-rendering="crispEdges">`
        + `<rect width="${total}" height="${h}" fill="#fff"/><path d="${path}" fill="#000"/>`
        + `<image href="${logo.href}" x="${c - lw / 2}" y="${c - lh / 2}" width="${lw}" height="${lh}" shape-rendering="auto"/>`
        + text_ + `</svg>`;
      return { svg, ratio: h / total };
    }

    function render() {
      const url = urlIn.value.trim();
      if (!labelEdited) labelIn.value = defaultLabel(url);
      if (!nameEdited) nameIn.value = url ? defaultName(url) : '';
      const warn = $('qm-warn');
      warn.hidden = !/^http:\/\//i.test(url);
      warn.textContent = 'This link starts with http://, so phones may show a "not secure" warning. Use https:// if the site supports it.';
      if (!url || !logo) {
        current = null;
        $('qm-canvas').textContent = logo ? 'Your code will show up here.' : 'Loading…';
      } else {
        try {
          current = makeSvg(url, labelIn.value.trim());
          $('qm-canvas').innerHTML = current.svg;
        } catch (e) {
          current = null;
          $('qm-canvas').textContent = 'That link is too long for a QR code.';
        }
      }
      $('qm-svg').disabled = $('qm-png').disabled = !current;
    }

    function download(blob, ext) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = (nameIn.value.trim() || 'qr-code') + '.' + ext;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    $('qm-svg').addEventListener('click', () => current && download(new Blob([current.svg], { type: 'image/svg+xml' }), 'svg'));
    $('qm-png').addEventListener('click', async () => {
      if (!current) return;
      const img = new Image();
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(current.svg);
      await img.decode();
      const canvas = document.createElement('canvas');
      canvas.width = PNG_WIDTH;
      canvas.height = Math.round(PNG_WIDTH * current.ratio);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(b => download(b, 'png'), 'image/png');
    });

    urlIn.addEventListener('input', render);
    labelIn.addEventListener('input', () => { labelEdited = labelIn.value !== defaultLabel(urlIn.value.trim()); render(); });
    nameIn.addEventListener('input', () => { nameEdited = true; });

    loadLogo().then(render, () => { $('qm-canvas').textContent = 'Could not load the logo. Try reloading the page.'; });
    render();
  })();
  </script>
</body>
</html>
